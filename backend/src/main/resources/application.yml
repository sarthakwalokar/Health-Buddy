spring:
  application:
    name: health-buddy-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthbuddy_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Sarthak@2006}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# App Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}        # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}   # 7 days
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@healthbuddy.com}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin@HealthBuddy2026!}
    full-name: ${ADMIN_BOOTSTRAP_NAME:System Administrator}
  storage:
    local:
      base-dir: ${STORAGE_BASE_DIR:./data/medical-reports}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE:20971520} # 20MB

# Springdoc OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.healthbuddy: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
